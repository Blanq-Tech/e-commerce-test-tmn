[project]
name = "ozon-rank-parser"
version = "0.1.0"
description = "Асинхронный многопоточный парсер позиций товаров в поиске Ozon на Playwright"
authors = [
    {name = "Konstantin Belov",email = "belofflab@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ozon-rank = "ozon_parser.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

